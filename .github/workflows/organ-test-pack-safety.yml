name: organ-test-pack-safety

on:
  pull_request:
    paths:
      - "manifests/tests/**"
      - "scripts/run-organ-test-packs.ps1"
  workflow_dispatch:

jobs:
  test-pack-safety:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bootstrap nested checkouts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File .\scripts\install-distribution.ps1 -Profile standard -NoDeps -NoEnv

      - name: Validate organ test pack safety
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\run-organ-test-packs.ps1 -Json
