[project]
name = "self-mirror-visual-analyzer"
version = "0.1.0"
description = "Self Mirror visual motion analyzer for ROI/timeline metric summaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.11.0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_mirror_visual_analyzer"]

[tool.uv]
cache-dir = ".uv-cache"
